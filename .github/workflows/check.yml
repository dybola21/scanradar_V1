name: Validar ScanRadar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: scanradar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d scanradar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:disposable-test-only@localhost:5432/scanradar_test
      ALLOW_TEST_DATABASE_RESET: 'yes'
      SCANRADAR_ENABLE_AUTOMATIONS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
